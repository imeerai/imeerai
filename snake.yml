# Builds the contribution snake (lime/orange on dark) and publishes it to the `output` branch.
# Runs on every push to main, every day, and on demand.
name: snake

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0e0e0e&color_dots=#ebedf0,#e9f9a6,#d4ff3a,#a8cc1f,#6b8a00
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff6a3d&color_background=#0e0e0e&color_dots=#1c1c1b,#3d4a0e,#7a9a12,#b5e02b,#d4ff3a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
